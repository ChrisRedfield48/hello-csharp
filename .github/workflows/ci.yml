name: C#/.NET CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --verbosity normal --configuration Release

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - rid: linux-x64
            artifact: hello-csharp-linux-x64
          - rid: osx-arm64
            artifact: hello-csharp-macos-arm64
          - rid: win-x64
            artifact: hello-csharp-windows-x64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Single-File Binary
        run: |
          dotnet publish src/App/App.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o output

      - name: Prepare Artifact
        shell: bash
        run: |
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            mv output/App.exe output/${{ matrix.artifact }}
          else
            mv output/App output/${{ matrix.artifact }}
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: output/${{ matrix.artifact }}
          generate_release_notes: true
